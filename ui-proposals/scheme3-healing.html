<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案三 · 治愈插画风</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  body { background:#E8EEF3; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .phone { width:360px; height:740px; background:linear-gradient(180deg,#E1F5FE 0%,#FFFFFF 55%); border-radius:38px; box-shadow:0 24px 60px rgba(20,40,80,.18); overflow:hidden; position:relative; display:flex; flex-direction:column; }
  .wave { position:absolute; bottom:0; left:0; width:100%; }
  .content { padding:40px 24px 24px; flex:1; display:flex; flex-direction:column; position:relative; z-index:2; }
  .hello { font-size:13px; color:#00838F; font-weight:600; }
  h1 { font-size:26px; color:#0F1B2D; margin-top:4px; font-weight:700; }
  .illus { align-self:center; margin:18px 0; }
  .bubble { background:#fff; border-radius:18px; padding:18px; box-shadow:0 8px 24px rgba(38,166,154,.15); position:relative; }
  .bubble:after { content:""; position:absolute; top:-10px; left:30px; border:10px solid transparent; border-bottom-color:#fff; }
  .bubble .q { color:#37474F; font-size:15px; line-height:1.7; }
  .bubble .who { color:#26A69A; font-size:12px; margin-top:8px; }
  .card { margin-top:18px; background:#fff; border-radius:18px; padding:16px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 6px 18px rgba(20,40,80,.06); }
  .card .lbl { font-size:16px; color:#0F1B2D; font-weight:600; }
  .card .sub { font-size:12px; color:#90A4AE; margin-top:2px; }
  .toggle { width:58px; height:32px; background:#26A69A; border-radius:18px; position:relative; }
  .toggle span { position:absolute; right:3px; top:3px; width:26px; height:26px; background:#fff; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .btn { margin-top:auto; background:linear-gradient(135deg,#26A69A,#29B6F6); color:#fff; border:none; padding:15px; border-radius:16px; font-size:16px; font-weight:600; }
  .tag { text-align:center; color:#9AA8BC; font-size:12px; padding:12px; position:relative; z-index:2; }
</style>
</head>
<body>
  <div class="phone">
    <div class="content">
      <div class="hello">嗨，记得照顾自己 ☀</div>
      <h1>该喝口水啦</h1>
      <svg class="illus" width="120" height="120" viewBox="0 0 120 120">
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4FC3F7"/><stop offset="1" stop-color="#29B6F6"/></linearGradient></defs>
        <path fill="url(#g)" d="M60 14S26 56 26 78a34 34 0 0 0 68 0C94 56 60 14 60 14z"/>
        <ellipse cx="48" cy="70" rx="9" ry="13" fill="#fff" opacity=".45"/>
      </svg>
      <div class="bubble">
        <div class="q">"把杯子端起来的那一刻，<br>你也在认真对待此刻的自己。"</div>
        <div class="who">— 今日一句</div>
      </div>
      <div class="card">
        <div><div class="lbl">喝水提醒</div><div class="sub">工作日每小时 · 已开启</div></div>
        <div class="toggle"><span></span></div>
      </div>
      <button class="btn">发送一条测试提醒</button>
    </div>
    <svg class="wave" viewBox="0 0 360 80" preserveAspectRatio="none">
      <path fill="#B3E5FC" d="M0 40 C 60 10 120 70 180 40 S 300 10 360 40 V80 H0 Z" opacity=".6"/>
      <path fill="#4FC3F7" d="M0 55 C 70 30 130 75 200 55 S 320 30 360 55 V80 H0 Z" opacity=".5"/>
    </svg>
    <div class="tag">方案三 · 治愈插画风（Warm &amp; Healing）</div>
  </div>
</body>
</html>
