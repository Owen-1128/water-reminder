<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案一 · 极简留白</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  body { background:#EEF2F6; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .phone { width:360px; height:740px; background:#FBFDFF; border-radius:38px; box-shadow:0 24px 60px rgba(20,40,80,.18); overflow:hidden; position:relative; display:flex; flex-direction:column; }
  .status { display:flex; justify-content:space-between; padding:14px 24px 0; font-size:13px; color:#0F1B2D; font-weight:600; }
  .dots { display:flex; gap:5px; } .dots i{width:7px;height:7px;border-radius:50%;background:#0F1B2D;display:block;}
  .content { padding:30px 26px; flex:1; display:flex; flex-direction:column; }
  .eyebrow { color:#7A8AA0; letter-spacing:3px; font-size:11px; margin-bottom:8px; }
  h1 { font-size:30px; font-weight:300; color:#0F1B2D; line-height:1.25; }
  h1 b { font-weight:600; }
  .rule { height:1px; background:#E3EAF2; margin:26px 0; }
  .big { display:flex; align-items:center; gap:18px; }
  .drop { width:64px; height:64px; flex:none; }
  .switch { position:relative; width:56px; height:32px; background:#2196F3; border-radius:20px; flex:none; }
  .switch span { position:absolute; right:3px; top:3px; width:26px; height:26px; background:#fff; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .schedule { color:#5A6B82; font-size:14px; margin-top:auto; }
  .next { color:#2196F3; font-size:15px; font-weight:600; margin-top:6px; }
  .quote { margin-top:22px; padding:18px 20px; border-left:3px solid #2196F3; background:#F3F8FE; border-radius:0 12px 12px 0; color:#33445C; font-size:15px; line-height:1.7; }
  .tag { text-align:center; color:#9AA8BC; font-size:12px; padding:14px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="status"><span>9:41</span><span class="dots"><i></i><i></i><i></i></span></div>
    <div class="content">
      <div class="eyebrow">WATER REMINDER</div>
      <h1>按时喝水，<br><b>是对自己温柔的坚持</b></h1>
      <div class="rule"></div>
      <div class="big">
        <svg class="drop" viewBox="0 0 24 24"><path fill="#2196F3" d="M12 2S5 11 5 15a7 7 0 0 0 14 0C19 11 12 2 12 2z"/></svg>
        <div style="flex:1">
          <div style="font-size:17px;color:#0F1B2D;font-weight:600">启用喝水提醒</div>
          <div style="font-size:13px;color:#7A8AA0;margin-top:3px">工作日 09:00 – 18:00</div>
        </div>
        <div class="switch"><span></span></div>
      </div>
      <div class="schedule">下次提醒</div>
      <div class="next">今天 14:00</div>
      <div class="quote">上善若水，水善利万物而不争——<br>也请温柔地善待自己的身体。</div>
    </div>
    <div class="tag">方案一 · 极简留白（Minimal &amp; Calm）</div>
  </div>
</body>
</html>
