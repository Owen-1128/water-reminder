<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案二 · 数据仪表盘</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  body { background:#EEF2F6; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .phone { width:360px; height:740px; background:#fff; border-radius:38px; box-shadow:0 24px 60px rgba(20,40,80,.18); overflow:hidden; display:flex; flex-direction:column; }
  .hdr { background:linear-gradient(135deg,#1565C0,#2196F3); padding:46px 24px 26px; color:#fff; }
  .hdr .t { font-size:18px; font-weight:600; }
  .hdr .s { font-size:12px; opacity:.85; margin-top:2px; }
  .ringwrap { display:flex; align-items:center; gap:16px; margin-top:18px; }
  .ring { width:92px; height:92px; flex:none; }
  .ringtxt { font-size:13px; opacity:.9; line-height:1.5; }
  .ringtxt b { font-size:22px; }
  .card { margin:16px; padding:16px; border-radius:16px; box-shadow:0 4px 16px rgba(20,40,80,.06); }
  .row { display:flex; justify-content:space-between; align-items:center; }
  .row .lbl { font-size:15px; color:#0F1B2D; font-weight:600; }
  .pill { width:50px; height:28px; background:#2196F3; border-radius:16px; position:relative; }
  .pill span { position:absolute; right:3px; top:3px; width:22px; height:22px; background:#fff; border-radius:50%; }
  .plus { display:flex; gap:10px; margin-top:14px; }
  .plus button { flex:1; border:none; background:#E3F2FD; color:#1565C0; font-size:14px; padding:12px; border-radius:12px; font-weight:600; }
  .chart { display:flex; align-items:flex-end; gap:8px; height:80px; margin-top:12px; }
  .chart .b { flex:1; background:#90CAF9; border-radius:6px 6px 0 0; }
  .chart .b.on { background:#2196F3; }
  .wd { display:flex; justify-content:space-between; font-size:11px; color:#7A8AA0; margin-top:6px; }
  .quote { margin:0 16px 16px; padding:14px 16px; background:#F3F8FE; border-radius:12px; color:#33445C; font-size:14px; line-height:1.6; }
  .tag { text-align:center; color:#9AA8BC; font-size:12px; padding:10px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="hdr">
      <div class="t">今日饮水</div>
      <div class="s">保持水润，状态在线</div>
      <div class="ringwrap">
        <svg class="ring" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="15.9" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="4"/>
          <circle cx="18" cy="18" r="15.9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="62 38" transform="rotate(-90 18 18)"/>
        </svg>
        <div class="ringtxt"><b>5</b> / 8 杯<br>已完成 62%</div>
      </div>
    </div>
    <div class="card">
      <div class="row"><span class="lbl">启用喝水提醒</span><div class="pill"><span></span></div></div>
      <div class="plus"><button>+1 杯 (250ml)</button><button>+ 自定义</button></div>
    </div>
    <div class="card">
      <div class="row"><span class="lbl">本周打卡</span><span style="color:#2196F3;font-size:13px">连续 4 天</span></div>
      <div class="chart">
        <div class="b on" style="height:60%"></div><div class="b on" style="height:80%"></div>
        <div class="b on" style="height:45%"></div><div class="b on" style="height:90%"></div>
        <div class="b" style="height:30%"></div><div class="b" style="height:10%"></div><div class="b" style="height:10%"></div>
      </div>
      <div class="wd"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    </div>
    <div class="quote">你忙着赶路，别让身体在半途干涸。</div>
    <div class="tag">方案二 · 数据仪表盘（Dashboard）</div>
  </div>
</body>
</html>
