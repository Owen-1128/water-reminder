name: Build APK

on:
  workflow_dispatch:        # 允许在 GitHub 上手动点击运行
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: '["platforms;android-34","build-tools;34.0.0","platform-tools"]'

      - name: 接受 Android SDK 许可协议（避免构建因许可未接受而失败）
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true

      - name: 安装 Gradle 8.5
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle.zip
          echo "$(pwd)/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: 构建 Debug APK
        run: gradle assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: water-reminder-apk
          path: app/build/outputs/apk/debug/*.apk
